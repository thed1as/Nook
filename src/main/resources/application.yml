spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/nook_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate.hibernate.format_sql: false
      hibernate.hibernate.generate_statistics: false
      hibernate.hibernate.jdbc.batch_size: 20
      hibernate:
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration, classpath:db/seed
  data:
    redis:
      port: ${REDIS_PORT:6379}
      host: ${REDIS_HOST:localhost}

  security:
    secret-access-key: ${ACCESS_SECURITY_KEY}
    secret-refresh-key: ${REFRESH_SECURITY_KEY}
    access-key-expiration: 3600000
    refresh-key-expiration: 604800000
  mail:
    host: mailpit
    port: 1025
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    mail-sender-name: nook@nook.mail
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  task:
    execution:
      pool:
        core-size: 5
        max-size: 10

minio:
  url: http://${MINIO_HOST:localhost}:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

app:
  booking:
    cancellation-window-days: 2

stripe:
  api:
    secret-key: ${STRIPE_SECRET_KEY}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  metrics:
    tags:
      application: ${spring.application.name:nook-app}

logging:
  level:
    org:
      hibernate:
        stat: DEBUG
        orm:
          results:
            loading: DEBUG

kind: Application